name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run coverage

      # Compile check only. No .env exists here, so Vite inlines `undefined`
      # for every VITE_* variable — the bundle builds but is not runnable.
      # Never deploy the artifact produced by this step.
      - name: Build
        run: npm run build
